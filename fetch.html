<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Card UID</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    .navbar {
      background-color: #dc3545; /* Red */
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .navbar-brand, .navbar-nav .nav-link {
      color: #fff !important;
    }
    .navbar-brand:hover, .navbar-nav .nav-link:hover {
      color: #ffc107 !important; /* Yellow hover effect */
    }
    .form-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .form-container h1 {
      color: #dc3545; /* Red */
      text-align: center;
      margin-bottom: 20px;
    }
    .btn-primary {
      background-color: #dc3545; /* Red */
      border: none;
    }
    .btn-primary:hover {
      background-color: #c82333; /* Darker red */
    }
    .btn-success {
      background-color: #28a745; /* Green */
      border: none;
    }
    .btn-success:hover {
      background-color: #218838; /* Darker green */
    }
    footer {
      background-color: #343a40; /* Dark gray */
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 50px;
    }
    footer a {
      color: #dc3545; /* Red */
      text-decoration: none;
    }
    footer a:hover {
      color: #ffc107; /* Yellow hover effect */
    }
    .logo{
        width: 50px;
        height: 50px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <!-- Logo and Brand -->
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="http://2.bp.blogspot.com/-5nU72jKeZqc/UaRvvZViyPI/AAAAAAAABrM/TbmXeLuU9do/s1600/APSRTC-Logo.jpg" alt="logo" class="logo me-2">
        APSRTC Bus Pass
      </a>

      <!-- Navbar Toggler for Mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar Links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="card_ver.html">Card verification</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="recharge.html">recharge</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="fetch.html">Test Fetch</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="form-container">
    <h1>Assign Card UID</h1>
    <form id="assignCardForm">
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number:</label>
        <input type="tel" class="form-control" id="phone" required />
      </div>
      <button type="button" class="btn btn-primary w-100" id="fetchDetails">Fetch Details</button>
      
      <!-- Details Section -->
      <div class="mt-3 d-none" id="detailsSection">
        <p><strong>Edit Details:</strong></p>
        <div id="editableDetails"></div>
        <div class="mb-3">
          <label for="cardUid" class="form-label">Enter Card UID:</label>
          <input type="text" class="form-control" id="cardUid" required />
        </div>
        <button type="button" class="btn btn-success w-100" id="assignCard">Assign Card</button>
      </div>
    </form>

    <!-- Confirmation Message -->
    <div class="alert alert-success d-none mt-3" id="confirmationMessage">
      <h4>Card Assigned Successfully!</h4>
    </div>
  </div>

  <!-- Success Modal -->
  <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="successModalLabel">Success</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Card assigned successfully!
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 APSRTC. All rights reserved.</p>
    <p><a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
  </footer>

  <!-- Firebase and Bootstrap JS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.11/firebase-app.js";
    import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/9.6.11/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA02GfjPGm1X8He9bLkrfkyBKWYgmMc98Q",
      authDomain: "buspass-2025.firebaseapp.com",
      projectId: "buspass-2025",
      storageBucket: "buspass-2025.appspot.com",
      messagingSenderId: "417197327685",
      appId: "1:417197327685:web:42d2d9e773512f7ba1ea2c",
      measurementId: "G-475C145WWK"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const phoneInput = document.getElementById("phone");
    const detailsSection = document.getElementById("detailsSection");
    const editableDetails = document.getElementById("editableDetails");
    const cardUidInput = document.getElementById("cardUid");
    const confirmationMessage = document.getElementById("confirmationMessage");
    const successModal = new bootstrap.Modal(document.getElementById('successModal'));

    let studentData = {};

    document.getElementById("fetchDetails").addEventListener("click", () => {
      const phone = phoneInput.value.trim(); // Trim whitespace

      // Check if the phone number input is empty
      if (!phone) {
        alert("Please enter a phone number to search.");
        return; // Stop execution if the input is empty
      }

      get(ref(database, '/busPasses/' + phone))
        .then(snapshot => {
          if (snapshot.exists()) {
            studentData = snapshot.val();
            displayEditableDetails(studentData);
            detailsSection.classList.remove("d-none");

            // Disable Card UID field if keyChanged is true
            if (studentData.keyChanged) {
              cardUidInput.disabled = true;
            } else {
              cardUidInput.disabled = false;
            }
          } else {
            alert("No details found for this phone number.");
          }
        })
        .catch(err => console.error(err));
    });

    function displayEditableDetails(data) {
      editableDetails.innerHTML = '';
      for (const key in data) {
        if (key !== 'keyChanged') {
          const value = data[key];
          const field = `
            <div class="mb-3">
              <label for="${key}" class="form-label">${key}:</label>
              <input type="text" class="form-control" id="${key}" value="${value}" />
            </div>
          `;
          editableDetails.innerHTML += field;
        }
      }
    }

    document.getElementById("assignCard").addEventListener("click", () => {
      const phone = phoneInput.value;
      const cardUid = cardUidInput.value;

      if (studentData.keyChanged) {
        alert("The Card UID can only be changed once. You cannot change it again.");
        return;
      }

      // Update student data with edited values
      for (const key in studentData) {
        if (key !== 'keyChanged') {
          studentData[key] = document.getElementById(key).value;
        }
      }

      // Set keyChanged to true and update the database
      studentData.keyChanged = true;

      set(ref(database, '/busPasses/' + cardUid), studentData)
        .then(() => {
          remove(ref(database, '/busPasses/' + phone))
            .then(() => {
              successModal.show();
              setTimeout(() => {
                successModal.hide();
                window.location.reload();
              }, 3000);
            })
            .catch(err => console.error(err));
        })
        .catch(err => console.error(err));
    });
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
