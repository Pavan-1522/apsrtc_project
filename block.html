<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APSRTC Bus Pass Fraud Check</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
      color: #333;
      font-family: 'Arial', sans-serif;
    }
    .navbar {
      background-color: #d32f2f;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .navbar-brand {
      color: #fff !important;
      font-weight: bold;
      font-size: 1.5rem;
    }
    .btn-primary {
      background-color: #d32f2f;
      border-color: #d32f2f;
      transition: background-color 0.3s ease;
    }
    .btn-primary:hover {
      background-color: #b71c1c;
      border-color: #b71c1c;
    }
    .dialog {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #fff;
      padding: 30px;

      z-index: 1000;
      border-radius: 15px;
      max-width: 400px;
      width: 90%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #d32f2f;
    }
    .card {
      border: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-radius: 15px;
      overflow: hidden;
    }
    .card-header {
      background-color: #d32f2f;
      color: #fff;
      font-weight: bold;
      font-size: 1.25rem;
      padding: 15px;
    }
    .card-body {
      padding: 20px;
    }
    .table {
      margin-bottom: 0;
    }
    .table th, .table td {
      vertical-align: middle;
    }
    .alert {
      margin-bottom: 0;
      border-radius: 10px;
    }
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.5);
    }
    .logo{
        width: 50px;
        height: 50px;
    }
    .footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px 0;
      margin-top: 40px;
    }
    .footer a {
      color: #dc3545; /* Red */
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
          <!-- Logo and Brand -->
          <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="http://2.bp.blogspot.com/-5nU72jKeZqc/UaRvvZViyPI/AAAAAAAABrM/TbmXeLuU9do/s1600/APSRTC-Logo.jpg" alt="logo" class="logo me-2">
            APSRTC Bus Pass
          </a>
    
          <!-- Navbar Toggler for Mobile -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
    
          <!-- Navbar Links -->
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="card_ver.html">Card verification</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="recharge.html">recharge</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="fetch.html">Test Fetch</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

  <!-- Main Content -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">
            Check Bus Pass Fraud Status
          </div>
          <div class="card-body">
            <input type="text" id="busPassId" class="form-control mb-3" placeholder="Enter Bus Pass ID">
            <button id="checkFraudBtn" class="btn btn-primary w-100">Check Fraud Status</button>
            <div id="result" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Unblock Dialog -->
  <div id="unblockDialog" class="dialog">
    <h5 class="mb-4">Unblock Bus Pass</h5>
    <input type="password" id="conductorPassword" class="form-control mb-3" placeholder="Enter Conductor Password">
    <div class="d-flex justify-content-end">
      <button id="cancelUnblockBtn" class="btn btn-secondary me-2">Cancel</button>
      <button id="confirmUnblockBtn" class="btn btn-primary">Unblock</button>
    </div>
  </div>
  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2023 APSRTC. All rights reserved. | <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
    </div>
  </footer>

  <!-- Firebase SDK (Modular v9+) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

    // Firebase configuration (replace with your own)
    const firebaseConfig = {
      apiKey: "AIzaSyA02GfjPGm1X8He9bLkrfkyBKWYgmMc98Q",
      authDomain: "buspass-2025.firebaseapp.com",
      projectId: "buspass-2025",
      storageBucket: "buspass-2025.appspot.com",
      messagingSenderId: "417197327685",
      appId: "1:417197327685:web:42d2d9e773512f7ba1ea2c",
      measurementId: "G-475C145WWK"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // DOM Elements
    const busPassIdInput = document.getElementById('busPassId');
    const checkFraudBtn = document.getElementById('checkFraudBtn');
    const resultDiv = document.getElementById('result');
    const unblockDialog = document.getElementById('unblockDialog');
    const conductorPasswordInput = document.getElementById('conductorPassword');
    const confirmUnblockBtn = document.getElementById('confirmUnblockBtn');
    const cancelUnblockBtn = document.getElementById('cancelUnblockBtn');

    // Check Fraud Status
    checkFraudBtn.addEventListener('click', async () => {
      const busPassId = busPassIdInput.value.trim();
      if (!busPassId) {
        alert('Please enter a valid Bus Pass ID.');
        return;
      }

      const busPassRef = ref(database, `busPasses/${busPassId}`);
      try {
        const snapshot = await get(busPassRef);
        if (snapshot.exists()) {
          const data = snapshot.val();
          const { name, validity, from, to, expiryDate, profilePicture, fraud } = data;

          // Display the result in a table
          resultDiv.innerHTML = `
            <div class="card mt-3">
              <div class="card-body">
                ${profilePicture ? `<img src="${profilePicture}" class="profile-img d-block mx-auto" alt="Profile Image">` : ''}
                <h5 class="card-title text-center">${name}</h5>
                <table class="table table-bordered mt-3">
                  <tr>
                    <th>Validity</th>
                    <td>${validity}</td>
                  </tr>
                  <tr>
                    <th>From</th>
                    <td>${from}</td>
                  </tr>
                  <tr>
                    <th>To</th>
                    <td>${to}</td>
                  </tr>
                  <tr>
                    <th>Expiry Date</th>
                    <td>${expiryDate}</td>
                  </tr>
                </table>
                ${fraud === 'yes' ? `
                  <div class="alert alert-danger mt-3">Your pass has a fraud alert.</div>
                  <button id="unblockBtn" class="btn btn-primary w-100 mt-3">Unblock Pass</button>
                ` : `
                  <div class="alert alert-success mt-3">Your pass has no fraud alerts.</div>
                `}
              </div>
            </div>
          `;

          // Add event listener for unblock button
          if (fraud === 'yes') {
            document.getElementById('unblockBtn').addEventListener('click', () => {
              unblockDialog.style.display = 'block';
            });
          }
        } else {
          resultDiv.innerHTML = `<div class="alert alert-warning">Bus Pass ID not found.</div>`;
        }
      } catch (error) {
        alert('Error checking fraud status: ' + error.message);
      }
    });

    // Unblock Pass
    confirmUnblockBtn.addEventListener('click', async () => {
      const password = conductorPasswordInput.value.trim();
      const busPassId = busPassIdInput.value.trim();

      // Replace '1234' with your actual conductor password
      if (password === '1234') {
        const busPassRef = ref(database, `busPasses/${busPassId}`);
        try {
          await update(busPassRef, { fraud: 'no' });
          resultDiv.innerHTML = `<div class="alert alert-success">Pass unblocked successfully.</div>`;
          unblockDialog.style.display = 'none';
        } catch (error) {
          alert('Error unblocking pass: ' + error.message);
        }
      } else {
        alert('Incorrect password. Please try again.');
      }
    });

    // Cancel Unblock
    cancelUnblockBtn.addEventListener('click', () => {
      unblockDialog.style.display = 'none';
    });
  </script>
</body>
</html>
